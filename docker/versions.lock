# versions.lock — Package version manifest for gr-atsc3 CI environment
#
# This file documents the pinned versions used in Dockerfile.ci
# Update versions here, then update Dockerfile.ci to match
#
# Format: package=version # notes

# Base image
ubuntu=22.04  # LTS, support until April 2027

# Build tools
build-essential=12.9ubuntu3
cmake=3.22.1-1ubuntu1.22.04.2
ninja-build=1.10.1-1
pkg-config=0.29.2-1ubuntu3
git=1:2.34.1-1ubuntu1.11
git-lfs=3.0.2-1ubuntu0.2

# Compilers
clang=1:14.0-55~exp2
clang-format=1:14.0-55~exp2

# Static analysis
cppcheck=2.7-1

# Core libraries
libfftw3-dev=3.3.8-2ubuntu8  # FFTW 3.3.8
libboost-dev=1.74.0.3ubuntu7  # Boost 1.74
libboost-system-dev=1.74.0.3ubuntu7

# Python
python3=3.10.6-1~22.04.1
python3-pip=22.0.2+dfsg-1ubuntu0.5
python3-venv=3.10.6-1~22.04.1

# Coverage
lcov=1.15-1
gcovr=5.0-2

# Documentation
doxygen=1.9.1-2ubuntu2

# Python packages (pip)
pre-commit=3.6.0
black=24.1.1
flake8=7.0.0

# Optional dependencies (not installed by default)
# gnuradio=3.10.x  # Install separately if needed
# uhd=3.15.x       # Install separately if needed
# gstreamer=1.20.x # Install separately if needed

# GoogleTest
# Fetched via CMake FetchContent, version specified in CMakeLists.txt
googletest=1.14.0

