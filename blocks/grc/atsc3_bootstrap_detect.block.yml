id: atsc3_bootstrap_detect
label: ATSC 3.0 Bootstrap Detector
category: '[ATSC 3.0]'
flags: [python, cpp]

parameters:
  - id: threshold
    label: Detection Threshold
    dtype: real
    default: '0.7'

inputs:
  - label: in
    domain: stream
    dtype: complex
  - label: reset
    domain: message
    optional: true

outputs:
  - label: out
    domain: stream
    dtype: complex
  - label: lock_status
    domain: message
    optional: true

templates:
  imports: from gnuradio import atsc3
  make: atsc3.bootstrap_detect(${threshold})
  callbacks:
    - set_threshold(${threshold})

cpp_templates:
  includes: ['#include <gnuradio/atsc3/atsc3_bootstrap_detect.h>']
  declarations: 'gr::atsc3::bootstrap_detect::sptr ${id};'
  make: 'this->${id} = gr::atsc3::bootstrap_detect::make(${threshold});'
  callbacks:
    - 'this->${id}->set_threshold(${threshold});'

documentation: |-
  ATSC 3.0 Bootstrap Signal Detector

  Detects ATSC 3.0 bootstrap signals using correlation with known
  bootstrap waveform. Outputs frame-aligned samples when locked.

  Parameters:
    threshold: Detection correlation threshold (0.0-1.0)

  Message Ports:
    reset (input): Resets detector state to searching mode
    lock_status (output): Emits lock state changes as dict:
      {locked: bool, cfo_hz: float, metric: float}

  API Methods:
    get_cfo_hz(): Current CFO estimate in Hz
    is_locked(): Current lock status
    reset(): Reset detector state

file_format: 1
