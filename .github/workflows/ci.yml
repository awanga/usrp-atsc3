name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache apt packages
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: apt-${{ hashFiles('docker/versions.lock') }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            gnuradio-dev libuhd-dev libfftw3-dev libboost-all-dev \
            ffmpeg libavcodec-dev libavformat-dev libavutil-dev \
            libunwind-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
            libgstreamer-plugins-bad1.0-dev libsndfile1-dev \
            cmake clang-format cppcheck python3-dev python3-numpy

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DATSC3_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build -j$(nproc)

      - name: Lint (clang-format)
        run: |
          find lib blocks hal -name '*.cc' -o -name '*.h' | \
            xargs clang-format --dry-run --Werror

      - name: Static analysis (cppcheck)
        run: |
          cppcheck --enable=warning,performance \
            --suppressions-list=.cppcheck \
            --error-exitcode=1 lib/ blocks/ hal/

      - name: Unit tests
        run: ctest --test-dir build -L unit --output-on-failure -j$(nproc)

      - name: Integration tests (IQ replay)
        run: ctest --test-dir build -L integration --output-on-failure

