name: Release

on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:gnuradio/gnuradio-releases-3.8
          sudo apt-get update && sudo apt-get install -y gnuradio-dev libuhd-dev \
            libfftw3-dev libboost-all-dev ffmpeg libavcodec-dev libavformat-dev \
            libavutil-dev libgstreamer1.0-dev libgstreamer-plugins-bad1.0-dev \
            cmake python3-dev python3-numpy

      - name: Build release
        run: |
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DATSC3_BUILD_TESTS=ON
          cmake --build build -j$(nproc)

      - name: Full test suite
        run: ctest --test-dir build --output-on-failure -j$(nproc)

      - name: Package (.deb)
        run: cd build && cpack -G DEB

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/*.deb
          generate_release_notes: true
